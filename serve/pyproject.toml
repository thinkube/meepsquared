[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "meepserve"
version = "0.1.0"
description = "Trained parts on a base model (taggers, choice heads), served behind Thinkube's LLM gateway"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Alejandro Martínez Corriá and the Thinkube contributors" }]
requires-python = ">=3.12"
# torch comes from the environment (the serving image, or PyTorch's wheel), as for Meep²
dependencies = [
    # A range, not one version: the serving images carry their own Transformers
    "transformers>=5.19,<6",
    "numpy>=1.26",
    "safetensors>=0.4",
]

[project.optional-dependencies]
# The choice kind: LoRA adapters with PEFT, and the base's 4-bit weights with bitsandbytes (placed on the GPU by Accelerate)
choice = ["peft>=0.21.2,<0.22", "bitsandbytes>=0.50", "accelerate>=1.15"]
# The choice kind on the vllm engine: the base held by vLLM 0.32, its 4-bit weights by the bitsandbytes plugin
vllm = ["vllm>=0.32,<0.33", "vllm-bnb-plugin>=0.0.3"]
test = ["pytest>=8", "peft>=0.21.2,<0.22"]

# The kinds of trained part this package serves; another package adds its own kinds under the same group
[project.entry-points."meepserve.kinds"]
tagger = "meepserve.tagger:KIND"
choice = "meepserve.choice:KIND"
generator = "meepserve.generator:KIND"

# vLLM runs it in each of its processes: the vllm engine's changes to the 4-bit loading (meepserve.vllm_engine.register)
[project.entry-points."vllm.general_plugins"]
meepserve = "meepserve.vllm_engine:register"

[project.urls]
Repository = "https://github.com/thinkube/meepsquared"

[tool.hatch.build.targets.wheel]
packages = ["src/meepserve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
